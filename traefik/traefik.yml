api:
  dashboard: true
  insecure: true

log:
  level: INFO

accessLog:
  format: json

entryPoints:
  web:
    address: ":80"
    http:
      # HTTPS en dev : tout le trafic HTTP est redirigé vers websecure.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  metrics:
    address: ":8082"

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: nutriplanner
  file:
    directory: /etc/traefik/dynamic
    watch: true