# ══════════════════════════════════════════════════════════
# MODE PROD LOCAL — même stack, cible Docker `prod`
#   make up-prod
#   (= docker compose -f docker-compose.yml -f infra/compose/prod.yml up -d --build)
#
# Différences avec le mode dev (le reste est hérité : env, réseau, ports, données) :
#   • images `:prod` (n'écrasent pas les images dev), utilisateur non-root ;
#   • code embarqué dans l'image : plus de montage du code de l'hôte ;
#   • uvicorn sans --reload, workers Celery sans watchmedo ;
#   • DEBUG=false, LOG_LEVEL=INFO (platform.env impose DEBUG pour le dev) ;
#   • service-recipe : 2 processus uvicorn (WEB_CONCURRENCY, lu par uvicorn).
# ══════════════════════════════════════════════════════════

services:
  service-user:
    image: nutri-app-service-user:prod
    build: { target: prod }
    volumes: !reset []
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  service-recipe:
    image: nutri-app-service-recipe:prod
    build: { target: prod }
    volumes: !reset []
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      # Service le plus sollicité (recherche) : 1 processus plafonne à ~1 cœur.
      - WEB_CONCURRENCY=2

  service-menu:
    image: nutri-app-service-menu:prod
    build: { target: prod }
    volumes: !reset []
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  service-crawler:
    image: nutri-app-service-crawler:prod
    build: { target: prod }
    volumes: !override
      - instagram-session:/data
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  service-notification:
    image: nutri-app-service-notification:prod
    build: { target: prod }
    volumes: !reset []
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  service-nutrition:
    image: nutri-app-service-nutrition:prod
    build: { target: prod }
    volumes: !reset []
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  service-profile:
    image: nutri-app-service-profile:prod
    build: { target: prod }
    volumes: !reset []
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  # ── Workers : même image que leur service, commande celery directe ─────
  celery-worker-recipe:
    image: nutri-app-service-recipe:prod
    volumes: !reset []
    command: celery -A celery_app worker -B --loglevel=info -Q recipe --concurrency=2
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  celery-worker-user:
    image: nutri-app-service-user:prod
    volumes: !reset []
    command: celery -A celery_app worker -B --loglevel=info -Q user --concurrency=2
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  celery-worker-notification:
    image: nutri-app-service-notification:prod
    volumes: !reset []
    command: celery -A celery_app worker -B --loglevel=info -Q notification --concurrency=2
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  celery-worker-crawler:
    image: nutri-app-service-crawler:prod
    volumes: !override
      - instagram-session:/data
    command: celery -A celery_app worker -B --loglevel=info -Q crawler --concurrency=2
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  celery-worker-nutrition:
    image: nutri-app-service-nutrition:prod
    command: celery -A celery_app worker -B --loglevel=info -Q nutrition --concurrency=2
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
