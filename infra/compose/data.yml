# ══════════════════════════════════════════════════════════
# DONNÉES — Postgres, Elasticsearch, Redis, SeaweedFS
# Chemins relatifs à CE fichier (infra/compose/).
# ══════════════════════════════════════════════════════════

services:
# ══════════════════════════════════════════════════════════
# SGBD
# ══════════════════════════════════════════════════════════
  # Moteur Postgres UNIQUE multi-bases (consolidation : 1 process, 7 bases).
  # Les rôles + bases sont créés au 1er boot par infra/postgres/initdb/*.sh.
  # Chaque base garde son rôle/mot de passe → isolation dure inchangée.
  postgres:
    image: postgres:16-alpine
    container_name: nutriplanner-postgres
    # Secrets plateforme : l'initdb consomme les POSTGRES_<SVC>_{DB,USER,PASSWORD}
    env_file: ../env/secrets/platform.secrets.env
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
    # SEC-01 : binding loopback uniquement — le port n'est plus exposé sur toutes
    # les interfaces de l'hôte. En prod, retirer entièrement `ports:` (accès via
    # le réseau Docker interne `nutriplanner` seulement).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# SEARCH ENGINE
# ══════════════════════════════════════════════════════════
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nutriplanner-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: 1g
    # SEC-01 : loopback uniquement (cf. postgres).
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nutriplanner

  redis:
    image: redis:7-alpine
    container_name: nutriplanner-redis
    # SEC-01 : loopback uniquement (cf. postgres).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# OBJECT STORAGE — SeaweedFS (compatible S3, remplace MinIO)
# ══════════════════════════════════════════════════════════
  # Mono-nœud all-in-one : master + volume + filer + gateway S3 dans un process
  # (`weed server -s3`). L'entrypoint génère la config S3 (identités) depuis les
  # secrets d'env, donc aucune clé n'est dans l'image ni committée.
  # Endpoint S3 = port 8333 (l'app y parle via boto3, addressing path-style).
  seaweedfs:
    image: chrislusf/seaweedfs:4.34
    container_name: nutriplanner-seaweedfs
    # platform.secrets.env porte S3_APP_ACCESS_KEY / S3_APP_SECRET_KEY.
    env_file: ../env/secrets/platform.secrets.env
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    # SEC-01 : loopback uniquement (endpoint S3). Pas de console web (SeaweedFS
    # n'a pas l'équivalent MinIO ; administration via `weed shell` / API).
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ../seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9333/cluster/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutriplanner
