# ══════════════════════════════════════════════════════════
# EDGE — reverse proxy Traefik + portail Swagger
# Chemins relatifs à CE fichier (infra/compose/).
# ══════════════════════════════════════════════════════════

services:
# ══════════════════════════════════════════════════════════
# REVERSE PROXY — Traefik v3.7
# ══════════════════════════════════════════════════════════
  traefik:
    image: traefik:v3.7
    container_name: nutriplanner-traefik
    ports:
      - "80:80"
      - "127.0.0.1:443:443"   # HTTPS dev (loopback, cf. SEC-01)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - ../traefik/certs:/etc/traefik/certs:ro   # certs mkcert (*.localhost)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.tls=true"
      - "traefik.http.routers.traefik-dash.service=api@internal"
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# PORTAIL — Swagger UI multi-specs
# ══════════════════════════════════════════════════════════
  portal:
    image: nginx:alpine
    container_name: nutriplanner-portal
    volumes:
      - ../portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../portal/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      service-user:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.portal.loadbalancer.server.port=80"
      - "traefik.http.routers.portal.rule=Host(`api.localhost`)"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls=true"
      - "traefik.http.routers.portal.service=portal"
    networks:
      - nutriplanner
    restart: unless-stopped
