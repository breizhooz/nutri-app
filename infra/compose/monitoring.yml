# ══════════════════════════════════════════════════════════
# MONITORING — métriques, logs, traces (profile `monitoring`)
# Démarrage : docker compose --profile monitoring up
# Chemins relatifs à CE fichier (infra/compose/).
# ══════════════════════════════════════════════════════════

services:
# ══════════════════════════════════════════════════════════
# MONITORING — Prometheus + Grafana + Exporters
# ══════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: nutriplanner-prometheus
    profiles: [monitoring]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - nutriplanner
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: nutriplanner-grafana
    profiles: [monitoring]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.localhost
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# LOGS LIVE — Loki + Alloy (Alloy remplace Promtail, déprécié)
# ══════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:3.7.9
    container_name: nutriplanner-loki
    profiles: [monitoring]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ../monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    networks:
      - nutriplanner
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.2
    container_name: nutriplanner-alloy
    profiles: [monitoring]
    # Lit les logs via l'API Docker ; positions de lecture persistées (alloy-data)
    # pour ne pas renvoyer l'historique à chaque redémarrage.
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ../monitoring/alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# TRACES — Tempo
# ══════════════════════════════════════════════════════════
  tempo:
    # Tempo 3 : non-root (uid 10001), cf. infra/monitoring/tempo/tempo.yml.
    image: grafana/tempo:3.1.1
    container_name: nutriplanner-tempo
    profiles: [monitoring]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../monitoring/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - nutriplanner
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: nutriplanner-cadvisor
    profiles: [monitoring]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,resctrl,cpuset,advtcp,memory_numa'
    networks:
      - nutriplanner
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0
    container_name: nutriplanner-redis-exporter
    profiles: [monitoring]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_CHECK_KEYS: "celery"
      REDIS_EXPORTER_CHECK_KEY_GROUPS: "celery.*"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nutriplanner
    restart: unless-stopped

  # Exporter Postgres UNIQUE : se connecte en superuser et auto-découvre toutes
  # les bases du moteur (7 → 1 exporter). Chaque base apparaît via le label
  # `datname` sur les métriques (au lieu d'un target par base).
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: nutriplanner-postgres-exporter
    profiles: [monitoring]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/postgres?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutriplanner
    restart: unless-stopped
