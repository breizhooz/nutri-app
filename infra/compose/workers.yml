# ══════════════════════════════════════════════════════════
# ASYNC — workers et schedulers Celery + Flower (profile `tools`, à la demande)
# Chemins relatifs à CE fichier (infra/compose/).
# ══════════════════════════════════════════════════════════

services:
# ──────────────────────────────────────────────────────────
# WORKER — recipe (import asynchrone des recettes)  ·  queue "recipe"
# ──────────────────────────────────────────────────────────
  celery-worker-recipe:
    # Même image que service-recipe (construite par lui, jamais tirée d'un registre).
    image: nutri-app-service-recipe
    pull_policy: never
    container_name: nutriplanner-celery-worker-recipe
    # Dev : watchmedo redémarre le worker à chaque modif *.py (Celery ne recharge
    # pas le code tout seul). En prod, remplacer par la commande celery directe.
    # `-B` embarque le scheduler beat (fetch Spoonacular quotidien) dans ce worker
    # unique. En prod multi-worker, lancer un process `celery beat` séparé à la place.
    command: sh -c "watchmedo auto-restart --directory=/app --patterns='*.py' --recursive --debug-force-polling --debounce-interval=1 -- celery -A celery_app worker -B --loglevel=info -Q recipe --concurrency=2"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_RECIPE_USER}:${POSTGRES_RECIPE_PASSWORD}@postgres:5432/${POSTGRES_RECIPE_DB}
      - SERVICE_USER_URL=http://service-user:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - ../env/platform.env
      - ../env/services/recipe.env
      - ../env/secrets/recipe.secrets.env
    volumes:
      - ../../service-recipe:/app
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-recipe:
        condition: service_started
    networks:
      - nutriplanner

# ──────────────────────────────────────────────────────────
# WORKER — user (effacement RGPD cross-service, art. 17)  ·  queue par défaut
# ──────────────────────────────────────────────────────────
  celery-worker-user:
    # Même image que service-user (construite par lui, jamais tirée d'un registre).
    image: nutri-app-service-user
    pull_policy: never
    container_name: nutriplanner-celery-worker-user
    # Dev : watchmedo redémarre le worker à chaque modif *.py (Celery ne recharge
    # pas le code à chaud). En prod, remplacer par la commande celery directe.
    # -B : beat embarqué (purges de rétention RGPD, Phase 4) dans ce worker unique.
    command: sh -c "watchmedo auto-restart --directory=/app --patterns='*.py' --recursive --debug-force-polling --debounce-interval=1 -- celery -A celery_app worker -B --loglevel=info -Q user --concurrency=2"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER_USER}:${POSTGRES_USER_PASSWORD}@postgres:5432/${POSTGRES_USER_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - ../env/platform.env
      - ../env/services/user.env
      - ../env/secrets/user.secrets.env
    volumes:
      - ../../service-user:/app
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-user:
        condition: service_started
    networks:
      - nutriplanner

# ──────────────────────────────────────────────────────────
# WORKER — notification (purge de rétention RGPD, art. 5.1.e)  ·  queue par défaut
# ──────────────────────────────────────────────────────────
  celery-worker-notification:
    # Même image que service-notification (construite par lui, jamais tirée d'un registre).
    image: nutri-app-service-notification
    pull_policy: never
    container_name: nutriplanner-celery-worker-notification
    # Dev : watchmedo redémarre le worker à chaque modif *.py (Celery ne recharge
    # pas le code à chaud). En prod, remplacer par la commande celery directe.
    # -B : beat embarqué (purge des notifications > 12 mois, Phase 4) dans ce worker.
    command: sh -c "watchmedo auto-restart --directory=/app --patterns='*.py' --recursive --debug-force-polling --debounce-interval=1 -- celery -A celery_app worker -B --loglevel=info -Q notification --concurrency=2"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_NOTIFICATION_USER}:${POSTGRES_NOTIFICATION_PASSWORD}@postgres:5432/${POSTGRES_NOTIFICATION_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - ../env/platform.env
      - ../env/services/notification.env
      - ../env/secrets/notification.secrets.env
    volumes:
      - ../../service-notification:/app
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-notification:
        condition: service_started
    networks:
      - nutriplanner

  celery-worker-crawler:
    # Même image que service-crawler (construite par lui, jamais tirée d'un registre).
    image: nutri-app-service-crawler
    pull_policy: never
    container_name: nutriplanner-celery-worker-crawler
    # Dev : watchmedo redémarre le worker à chaque modif *.py (Celery ne recharge pas
    # le code à chaud). watchdog est inclus dans la cible `dev` de l'image
    # (infra/docker/service.Dockerfile). --debug-force-polling car les
    # événements inotify ne traversent pas toujours le bind mount.
    # NB : commande sur une seule ligne (un bloc YAML `>` casserait le `--` de watchmedo).
    # `-B` : beat embarqué (DatabaseBackedScheduler des sources de crawl) — un seul
    # worker crawler, donc pas de double planification ; plus de conteneur beat dédié.
    command: sh -c "watchmedo auto-restart --directory=/app --patterns='*.py' --recursive --debug-force-polling --debounce-interval=1 -- celery -A celery_app worker -B --loglevel=info -Q crawler --concurrency=2"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_CRAWLER_USER}:${POSTGRES_CRAWLER_PASSWORD}@postgres:5432/${POSTGRES_CRAWLER_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - ../env/platform.env
      - ../env/services/crawler.env
      - ../env/secrets/crawler.secrets.env
    volumes:
      - ../../service-crawler:/app
      - instagram-session:/data
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-crawler:
        condition: service_started
    networks:
      - nutriplanner

  celery-worker-nutrition:
    # Même image que service-nutrition (construite par lui, jamais tirée d'un registre).
    image: nutri-app-service-nutrition
    pull_policy: never
    container_name: nutriplanner-celery-worker-nutrition
    # --concurrency=2 : sans limite, Celery lance 1 process par cœur (12 → ~516 Mo).
    # `-B` : beat embarqué (import Ciqual, enrichissement OFF, rétention) — un seul
    # worker nutrition, donc pas de double planification ; plus de conteneur beat dédié.
    command: celery -A celery_app worker -B --loglevel=info -Q nutrition --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_NUTRITION_USER}:${POSTGRES_NUTRITION_PASSWORD}@postgres:5432/${POSTGRES_NUTRITION_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - ../env/platform.env
      - ../env/services/nutrition.env
      - ../env/secrets/nutrition.secrets.env
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-nutrition:
        condition: service_started
    networks:
      - nutriplanner

  # Outil de diagnostic, à la demande (profile `tools`) : make flower
  # Image officielle dédiée : ni code ni secrets d'un service métier, seulement le
  # broker. Sans `-A`, Flower découvre workers/files/tâches via Redis et les
  # événements des workers (il les active lui-même) → toutes les queues sont vues.
  celery-flower:
    image: mher/flower:2.0.1
    container_name: nutriplanner-celery-flower
    profiles: [tools]
    # SEC-02 : Flower exige désormais une auth basique. `FLOWER_BASIC_AUTH` (format
    # "user:password") est lu depuis le `.env` racine ; valeur de repli volontairement
    # à changer pour éviter tout démarrage sans auth réelle.
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555", "--basic-auth=${FLOWER_BASIC_AUTH:-flower:change-me-in-env}"]
    # SEC-01/02 : loopback uniquement, en complément de l'auth basique ci-dessus.
    ports:
      - "127.0.0.1:5555:5555"
    mem_limit: 256m
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nutriplanner
