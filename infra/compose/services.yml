# ══════════════════════════════════════════════════════════
# SERVICES MÉTIER — les 7 API FastAPI
# Chemins relatifs à CE fichier (infra/compose/).
# Les anchors YAML (&/*) ont une portée limitée à ce fichier.
# ══════════════════════════════════════════════════════════

# Healthcheck API standard (services qui démarrent vite).
# Chaque sonde lance un interpréteur Python (~75 ms de CPU) : toutes les 30 s en
# régime établi, mais toutes les 2 s pendant le démarrage (start_interval), pour
# que les `depends_on: service_healthy` restent rapides. Docker ≥ 25.
x-healthcheck-api: &healthcheck-api
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 60s
  start_interval: 2s

# Variante tolérante (menu/crawler : démarrage + migrations plus longs).
x-healthcheck-api-slow: &healthcheck-api-slow
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 120s
  start_interval: 2s

services:
# ══════════════════════════════════════════════════════════
# SERVICE — user  →  http://api-users.localhost
# ══════════════════════════════════════════════════════════
  service-user:
    image: nutri-app-service-user
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      target: dev
      args:
        SERVICE: user
    container_name: nutriplanner-service-user
    ports:
      - "8001:8000"
    volumes:
      - ../../service-user:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER_USER}:${POSTGRES_USER_PASSWORD}@postgres:5432/${POSTGRES_USER_DB}
    env_file:
      - ../env/platform.env
      - ../env/services/user.env
      - ../env/secrets/user.secrets.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *healthcheck-api
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# SERVICE — recipe  →  http://api-recipe.localhost
# ══════════════════════════════════════════════════════════
  service-recipe:
    image: nutri-app-service-recipe
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      target: dev
      args:
        SERVICE: recipe
    container_name: nutriplanner-service-recipe
    ports:
      - "8002:8000"
    volumes:
      - ../../service-recipe:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_RECIPE_USER}:${POSTGRES_RECIPE_PASSWORD}@postgres:5432/${POSTGRES_RECIPE_DB}
      - SERVICE_USER_URL=http://service-user:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - ../env/platform.env
      - ../env/services/recipe.env
      - ../env/secrets/recipe.secrets.env
    depends_on:
      postgres:
        condition: service_healthy
      service-user:
        condition: service_healthy
    healthcheck: *healthcheck-api
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# SERVICE — menu  →  http://api-menu.localhost
# ══════════════════════════════════════════════════════════
  service-menu:
    image: nutri-app-service-menu
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      target: dev
      args:
        SERVICE: menu
        APT_PACKAGES: "libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core"
    container_name: nutriplanner-service-menu
    ports:
      - "8003:8000"
    volumes:
      - ../../service-menu:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_MENU_USER}:${POSTGRES_MENU_PASSWORD}@postgres:5432/${POSTGRES_MENU_DB}
      - SERVICE_USER_URL=http://service-user:8000
      - SERVICE_RECIPE_URL=http://service-recipe:8000
    env_file:
      - ../env/platform.env
      - ../env/services/menu.env
      - ../env/secrets/menu.secrets.env
    depends_on:
      postgres:
        condition: service_healthy
      service-user:
        condition: service_healthy
      service-recipe:
        condition: service_healthy
    healthcheck: *healthcheck-api-slow
    networks:
      - nutriplanner

