# HTTPS en dev : certificat de confiance généré par mkcert pour *.localhost.
# Générer les certs : ./infra/traefik/gen-certs.sh (puis `mkcert -install` une fois).
# Le dossier traefik/certs/ est ignoré par git (ne jamais commiter la clé privée).
tls:
  certificates:
    - certFile: /etc/traefik/certs/_wildcard.localhost.pem
      keyFile: /etc/traefik/certs/_wildcard.localhost-key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/_wildcard.localhost.pem
        keyFile: /etc/traefik/certs/_wildcard.localhost-key.pem
