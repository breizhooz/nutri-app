http:
  middlewares:
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
    cors:
      headers:
        # SEC-04 : allowlist explicite d'origines (plus de "*"). Ajouter ici les
        # origines réelles du front. En prod, remplacer par le domaine HTTPS.
        accessControlAllowOriginList:
          - "https://localhost:5173"   # front Vite (dev, HTTPS via mkcert)
          # - "https://app.nutriplanner.fr"   # prod
        # Requis dès qu'on passe le refresh token en cookie (SEC-05) ; sans effet
        # tant que l'auth reste par header Authorization.
        accessControlAllowCredentials: true
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "Accept-Language"
          # E2E : verrouillage optimiste des blobs chiffrés (PUT/DELETE avec If-Match).
          - "If-Match"
        accessControlExposeHeaders:
          - "X-Trace-Id"
          - "X-Request-ID"
          # ETag = version courante du blob (lecture côté client après PUT/GET/412).
          - "ETag"
        accessControlMaxAge: 3600