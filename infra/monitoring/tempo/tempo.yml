# Tempo 3 — binaire unique, stockage local.
# Tempo 3 a supprimé `ingester` et `compactor` : l'écriture passe par le
# live-store/block-builder et la rétention par backend_scheduler/backend_worker
# (configurés automatiquement en binaire unique). Conteneur non-root (uid 10001).
server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Rétention des traces : 24 h (dev). Même valeur côté planificateur et worker.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 24h
backend_worker:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
