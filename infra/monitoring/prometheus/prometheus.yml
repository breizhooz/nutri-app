global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Traefik — métriques HTTP (requêtes, latences, codes HTTP par service)
  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']

  # Redis — mémoire, hit/miss, connexions
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # Elasticsearch — heap JVM, indexation, latence
  - job_name: elasticsearch
    static_configs:
      - targets: ['elasticsearch-exporter:9114']

  # PostgreSQL — moteur unique multi-bases : 1 seul exporter en auto-discover.
  # Les bases sont distinguées par le label `datname` porté par les métriques
  # (ex. pg_stat_database_*) ; plus besoin d'un target par base.
  - job_name: postgres
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  # cAdvisor — métriques containers Docker (CPU, mémoire, état)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Services FastAPI — décommenter après Phase 3
  - job_name: services
    static_configs:
      - targets:
          - 'service-user:8000'
          - 'service-recipe:8000'
          - 'service-menu:8000'
          - 'service-crawler:8000'
          - 'service-notification:8000'
          - 'service-nutrition:8000'
          - 'service-profile:8000'
    metrics_path: /metrics