[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutri-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "fastapi>=0.141",
    "starlette>=1.3.1",  # sécu : 14 failles < 1.3.1 (MAJ_OBLIGATOIRE §1)
    "PyJWT>=2.15",
    "unidecode>=1.3",
    "structlog>=24.4",
    "cryptography>=42.0.0",  # chiffrement at-rest (db.encrypted.EncryptedText)
    # observabilité
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "prometheus-fastapi-instrumentator>=8.1",  # 7.x plafonne starlette < 1.0
]

[tool.setuptools.packages.find]
where = ["."]