[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutri-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "fastapi>=0.115",
    "PyJWT>=2.9",
    "unidecode>=1.3",
    "structlog>=24.4",
]

[tool.setuptools.packages.find]
where = ["."]
