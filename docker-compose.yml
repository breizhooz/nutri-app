      - "traefik.http.services.svc-notif.loadbalancer.server.port=8000"
      - "traefik.http.routers.svc-notif.rule=Host(`api-notification.localhost`)"
      - "traefik.http.routers.svc-notif.entrypoints=web"
      - "traefik.http.routers.svc-notif.service=svc-notif"
      - "traefik.http.routers.svc-notif.middlewares=cors@file"
    depends_on:
