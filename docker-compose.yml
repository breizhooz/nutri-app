      context: .
      dockerfile: service-profile/Dockerfile
    container_name: nutriplanner-service-profile
    ports:
      - "8007:8000"
    volumes:
      - ./service-profile:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_PROFILE_USER}:${POSTGRES_PROFILE_PASSWORD}@postgres-profile:5432/${POSTGRES_PROFILE_DB}
    env_file:
