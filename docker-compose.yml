# ══════════════════════════════════════════════════════════
# SEARCH ENGINE
# ══════════════════════════════════════════════════════════
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nutriplanner-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: 1g
    # SEC-01 : loopback uniquement (cf. postgres).
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nutriplanner

  redis:
    image: redis:7-alpine
    container_name: nutriplanner-redis
    # SEC-01 : loopback uniquement (cf. postgres).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# ASYNC SCHEDULER — Celery
# ══════════════════════════════════════════════════════════
  celery-beat:
    build:
      context: .
      dockerfile: service-crawler/Dockerfile
    container_name: nutriplanner-celery-beat
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_CRAWLER_USER}:${POSTGRES_CRAWLER_PASSWORD}@postgres:5432/${POSTGRES_CRAWLER_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - .env
      - ./service-crawler/conf/.env
    volumes:
      - ./service-crawler:/app
    mem_limit: 128m
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-crawler:
        condition: service_started
    networks:
      - nutriplanner

  celery-worker-crawler:
    build:
      context: .
      dockerfile: service-crawler/Dockerfile
    container_name: nutriplanner-celery-worker-crawler
    # Dev : watchmedo redémarre le worker à chaque modif *.py (Celery ne recharge pas
    # le code à chaud). watchdog est dans requirements.txt → `pip install` instantané
    # après un rebuild, sinon installé au 1er démarrage. --debug-force-polling car les
    # événements inotify ne traversent pas toujours le bind mount.
    # NB : commande sur une seule ligne (un bloc YAML `>` casserait le `--` de watchmedo).
    command: sh -c "pip install --no-cache-dir watchdog==4.0.2 && watchmedo auto-restart --directory=/app --patterns='*.py' --recursive --debug-force-polling --debounce-interval=1 -- celery -A celery_app worker --loglevel=info -Q crawler --concurrency=2"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_CRAWLER_USER}:${POSTGRES_CRAWLER_PASSWORD}@postgres:5432/${POSTGRES_CRAWLER_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - .env
      - ./service-crawler/conf/.env
    volumes:
      - ./service-crawler:/app
      - instagram-session:/data
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-crawler:
        condition: service_started
    networks:
      - nutriplanner

  celery-beat-nutrition:
    build:
      context: .
      dockerfile: service-nutrition/Dockerfile
    container_name: nutriplanner-celery-beat-nutrition
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_NUTRITION_USER}:${POSTGRES_NUTRITION_PASSWORD}@postgres:5432/${POSTGRES_NUTRITION_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
      - ./service-nutrition/conf/.env
    mem_limit: 128m
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-nutrition:
        condition: service_started
    networks:
      - nutriplanner

  celery-worker-nutrition:
    build:
      context: .
      dockerfile: service-nutrition/Dockerfile
    container_name: nutriplanner-celery-worker-nutrition
    command: celery -A celery_app worker --loglevel=info -Q celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_NUTRITION_USER}:${POSTGRES_NUTRITION_PASSWORD}@postgres:5432/${POSTGRES_NUTRITION_DB}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
      - ./service-nutrition/conf/.env
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-nutrition:
        condition: service_started
    networks:
      - nutriplanner

  celery-flower:
    build:
      context: .
      dockerfile: service-nutrition/Dockerfile
    container_name: nutriplanner-celery-flower
    entrypoint: ["celery"]
    # SEC-02 : Flower exige désormais une auth basique. `FLOWER_BASIC_AUTH` (format
    # "user:password") est lu depuis le `.env` racine ; valeur de repli volontairement
    # à changer pour éviter tout démarrage sans auth réelle.
    command: ["-A", "celery_app", "flower", "--port=5555", "--broker=redis://redis:6379/0", "--basic-auth=${FLOWER_BASIC_AUTH:-flower:change-me-in-env}"]
    environment:
            - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - .env
      - ./service-nutrition/conf/.env
    # SEC-01/02 : loopback uniquement, en complément de l'auth basique ci-dessus.
    ports:
      - "127.0.0.1:5555:5555"
    mem_limit: 256m
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# OBJECT STORAGE — MinIO
# ══════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: nutriplanner-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # SEC-01 : loopback uniquement (API S3 + console). En prod, exposer la console
    # (9001) derrière Traefik avec auth plutôt qu'en direct sur l'hôte.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# MONITORING — Prometheus + Grafana + Exporters
# Démarrage : docker compose --profile monitoring up
# ══════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: nutriplanner-prometheus
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.service=prometheus"
    networks:
      - nutriplanner
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: nutriplanner-grafana
    profiles: [monitoring]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.localhost
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.service=grafana"
    depends_on:
      - prometheus
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# LOGS LIVE — Loki + Promtail
# ══════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:3.0.0
    container_name: nutriplanner-loki
    profiles: [monitoring]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.http.routers.loki.rule=Host(`loki.localhost`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.http.routers.loki.service=loki"
    networks:
      - nutriplanner
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: nutriplanner-promtail
    profiles: [monitoring]
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# TRACES — Tempo
# ══════════════════════════════════════════════════════════
  tempo:
    image: grafana/tempo:2.4.0
    container_name: nutriplanner-tempo
    profiles: [monitoring]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    ports:
      - "4317:4317"
      - "4318:4318"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"
      - "traefik.http.routers.tempo.rule=Host(`tempo.localhost`)"
      - "traefik.http.routers.tempo.entrypoints=websecure"
      - "traefik.http.routers.tempo.tls=true"
      - "traefik.http.routers.tempo.service=tempo"
    networks:
      - nutriplanner
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nutriplanner-cadvisor
    profiles: [monitoring]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,resctrl,cpuset,advtcp,memory_numa'
    networks:
      - nutriplanner
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: nutriplanner-redis-exporter
    profiles: [monitoring]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_CHECK_KEYS: "celery"
      REDIS_EXPORTER_CHECK_KEY_GROUPS: "celery.*"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nutriplanner
    restart: unless-stopped

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: nutriplanner-elasticsearch-exporter
    profiles: [monitoring]
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.all'
      - '--es.indices'
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nutriplanner
    restart: unless-stopped

  # Exporter Postgres UNIQUE : se connecte en superuser et auto-découvre toutes
  # les bases du moteur (7 → 1 exporter). Chaque base apparaît via le label
  # `datname` sur les métriques (au lieu d'un target par base).
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: nutriplanner-postgres-exporter
    profiles: [monitoring]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/postgres?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutriplanner
    restart: unless-stopped

networks:
  nutriplanner:
    driver: bridge

volumes:
  instagram-session:
  pgdata:
  es-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data: