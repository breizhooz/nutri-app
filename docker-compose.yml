# ══════════════════════════════════════════════════════════
# SERVICE — user  →  http://api-users.localhost
# ══════════════════════════════════════════════════════════
  service-user:
    build:
      context: .
      dockerfile: service-user/Dockerfile
    container_name: nutriplanner-service-user
    ports:
      - "8001:8000"
    volumes:
      - ./service-user:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER_USER}:${POSTGRES_USER_PASSWORD}@postgres-user:5432/${POSTGRES_USER_DB}
    env_file:
      - .env
      - ./service-user/conf/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.svc-user.loadbalancer.server.port=8000"
      - "traefik.http.routers.svc-user.rule=Host(`api-users.localhost`)"
      - "traefik.http.routers.svc-user.entrypoints=web"
      - "traefik.http.routers.svc-user.service=svc-user"
      - "traefik.http.routers.svc-user.middlewares=cors@file"
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# SERVICE — recipe  →  http://api-recipe.localhost
# ══════════════════════════════════════════════════════════
  service-recipe:
    build:
      context: .
      dockerfile: service-recipe/Dockerfile
    container_name: nutriplanner-service-recipe
    ports:
      - "8002:8000"
    volumes:
      - ./service-recipe:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_RECIPE_USER}:${POSTGRES_RECIPE_PASSWORD}@postgres-recipe:5432/${POSTGRES_RECIPE_DB}
      - SERVICE_USER_URL=http://service-user:8000
    env_file:
      - .env
      - ./service-recipe/conf/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.svc-recipe.loadbalancer.server.port=8000"
      - "traefik.http.routers.svc-recipe.rule=Host(`api-recipe.localhost`)"
      - "traefik.http.routers.svc-recipe.entrypoints=web"
      - "traefik.http.routers.svc-recipe.service=svc-recipe"
      - "traefik.http.routers.svc-recipe.middlewares=cors@file"
    depends_on:
      postgres-recipe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      service-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# SERVICE — menu  →  http://api-menu.localhost
