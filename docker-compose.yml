services:
# ══════════════════════════════════════════════════════════
# REVERSE PROXY — Traefik v3.7
# ══════════════════════════════════════════════════════════
  traefik:
    image: traefik:v3.7
    container_name: nutriplanner-traefik
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dash.entrypoints=web"
      - "traefik.http.routers.traefik-dash.service=api@internal"
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# PORTAIL — Swagger UI multi-specs
# ══════════════════════════════════════════════════════════
  portal:
    image: nginx:alpine
    container_name: nutriplanner-portal
    volumes:
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portal/index.html:/usr/share/nginx/html/index.html:ro
    depends_on: 
      service-user:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.portal.loadbalancer.server.port=80"
      - "traefik.http.routers.portal.rule=Host(`api.localhost`)"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.routers.portal.service=portal"
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# FILEBEAT — filebeat logs
# ══════════════════════════════════════════════════════════
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: nutriplanner-filebeat
    profiles: [monitoring]
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nutriplanner
    restart: unless-stopped
# ══════════════════════════════════════════════════════════
# SGBD
# ══════════════════════════════════════════════════════════
  postgres-user:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_USER_DB}
      POSTGRES_USER: ${POSTGRES_USER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata-user:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER} -d ${POSTGRES_USER_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nutriplanner

  postgres-recipe:
