      - nutriplanner

# ══════════════════════════════════════════════════════════
# SERVICE — nutrition  →  http://api-nutrition.localhost
# ══════════════════════════════════════════════════════════
  service-nutrition:
    build:
      context: .
      dockerfile: service-nutrition/Dockerfile
    container_name: nutriplanner-service-nutrition
    ports:
      - "8005:8000"
    volumes:
      - ./service-nutrition:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_NUTRITION_USER}:${POSTGRES_NUTRITION_PASSWORD}@postgres-nutrition:5432/${POSTGRES_NUTRITION_DB}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SERVICE_NOTIFICATION_URL=http://service-notification:8000
    env_file:
      - .env
      - ./service-nutrition/conf/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.svc-nutrition.loadbalancer.server.port=8000"
      - "traefik.http.routers.svc-nutrition.rule=Host(`api-nutrition.localhost`)"
      - "traefik.http.routers.svc-nutrition.entrypoints=web"
      - "traefik.http.routers.svc-nutrition.service=svc-nutrition"
      - "traefik.http.routers.svc-nutrition.middlewares=cors@file"
    depends_on:
      postgres-nutrition:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - nutriplanner

