services:
# ══════════════════════════════════════════════════════════
# REVERSE PROXY — Traefik v3.7
# ══════════════════════════════════════════════════════════
  traefik:
    image: traefik:v3.7
    container_name: nutriplanner-traefik
    ports:
      - "80:80"
      - "127.0.0.1:443:443"   # HTTPS dev (loopback, cf. SEC-01)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro   # certs mkcert (*.localhost)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.tls=true"
      - "traefik.http.routers.traefik-dash.service=api@internal"
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# PORTAIL — Swagger UI multi-specs
# ══════════════════════════════════════════════════════════
  portal:
    image: nginx:alpine
    container_name: nutriplanner-portal
    volumes:
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portal/index.html:/usr/share/nginx/html/index.html:ro
    depends_on: 
      service-user:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.portal.loadbalancer.server.port=80"
      - "traefik.http.routers.portal.rule=Host(`api.localhost`)"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls=true"
      - "traefik.http.routers.portal.service=portal"
    networks:
      - nutriplanner
    restart: unless-stopped

# ══════════════════════════════════════════════════════════
# FILEBEAT — filebeat logs
# ══════════════════════════════════════════════════════════
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: nutriplanner-filebeat
    profiles: [monitoring]
    user: root
    # filebeat.yml est bind-mounté depuis l'hôte (uid 1000) alors que filebeat
    # tourne en root → le contrôle de permissions strict refuse de démarrer.
    # --strict.perms=false le désactive (recommandé Elastic pour configs montées).
    command: ["--strict.perms=false", "-environment", "container"]
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nutriplanner
    restart: unless-stopped
# ══════════════════════════════════════════════════════════
# SGBD
# ══════════════════════════════════════════════════════════
  # Moteur Postgres UNIQUE multi-bases (consolidation : 1 process, 7 bases).
  # Les rôles + bases sont créés au 1er boot par postgres/initdb/*.sh.
  # Chaque base garde son rôle/mot de passe → isolation dure inchangée.
  postgres:
    image: postgres:16-alpine
    container_name: nutriplanner-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
    # SEC-01 : binding loopback uniquement — le port n'est plus exposé sur toutes
    # les interfaces de l'hôte. En prod, retirer entièrement `ports:` (accès via
    # le réseau Docker interne `nutriplanner` seulement).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# SERVICE — user  →  http://api-users.localhost
# ══════════════════════════════════════════════════════════
  service-user:
    build:
      context: .
      dockerfile: service-user/Dockerfile
    container_name: nutriplanner-service-user
    ports:
      - "8001:8000"
    volumes:
      - ./service-user:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER_USER}:${POSTGRES_USER_PASSWORD}@postgres:5432/${POSTGRES_USER_DB}
    env_file:
      - .env
      - ./service-user/conf/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.svc-user.loadbalancer.server.port=8000"
      - "traefik.http.routers.svc-user.rule=Host(`api-users.localhost`)"
      - "traefik.http.routers.svc-user.entrypoints=websecure"
      - "traefik.http.routers.svc-user.tls=true"
      - "traefik.http.routers.svc-user.service=svc-user"
      - "traefik.http.routers.svc-user.middlewares=cors@file"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# SERVICE — recipe  →  http://api-recipe.localhost
# ══════════════════════════════════════════════════════════
  service-recipe:
    build:
      context: .
      dockerfile: service-recipe/Dockerfile
    container_name: nutriplanner-service-recipe
    ports:
      - "8002:8000"
    volumes:
      - ./service-recipe:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_RECIPE_USER}:${POSTGRES_RECIPE_PASSWORD}@postgres:5432/${POSTGRES_RECIPE_DB}
      - SERVICE_USER_URL=http://service-user:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
      - ./service-recipe/conf/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.svc-recipe.loadbalancer.server.port=8000"
      - "traefik.http.routers.svc-recipe.rule=Host(`api-recipe.localhost`)"
      - "traefik.http.routers.svc-recipe.entrypoints=websecure"
      - "traefik.http.routers.svc-recipe.tls=true"
      - "traefik.http.routers.svc-recipe.service=svc-recipe"
      - "traefik.http.routers.svc-recipe.middlewares=cors@file"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      service-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - nutriplanner

# ──────────────────────────────────────────────────────────
# WORKER — recipe (import asynchrone des recettes)  ·  queue "recipe"
# ──────────────────────────────────────────────────────────
  celery-worker-recipe:
    build:
      context: .
      dockerfile: service-recipe/Dockerfile
    container_name: nutriplanner-celery-worker-recipe
    # Dev : watchmedo redémarre le worker à chaque modif *.py (Celery ne recharge
    # pas le code tout seul). En prod, remplacer par la commande celery directe.
    # `-B` embarque le scheduler beat (fetch Spoonacular quotidien) dans ce worker
    # unique. En prod multi-worker, lancer un process `celery beat` séparé à la place.
    command: sh -c "pip install --no-cache-dir watchdog==4.0.2 && watchmedo auto-restart --directory=/app --patterns='*.py' --recursive --debug-force-polling --debounce-interval=1 -- celery -A celery_app worker -B --loglevel=info -Q recipe --concurrency=2"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_RECIPE_USER}:${POSTGRES_RECIPE_PASSWORD}@postgres:5432/${POSTGRES_RECIPE_DB}
      - SERVICE_USER_URL=http://service-user:8000
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
      - ./service-recipe/conf/.env
    volumes:
      - ./service-recipe:/app
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-recipe:
        condition: service_started
    networks:
      - nutriplanner

# ══════════════════════════════════════════════════════════
# SERVICE — menu  →  http://api-menu.localhost
# ══════════════════════════════════════════════════════════
  service-menu:
    build:
      context: .
      dockerfile: service-menu/Dockerfile
    container_name: nutriplanner-service-menu
    ports:
