# Nom de projet figé : le dossier s'appelle backend/ depuis le split des repos,
# mais conteneurs ET volumes (postgres…) restent préfixés nutri-app.
name: nutri-app

# Façade d'orchestration — la définition réelle vit dans infra/compose/*.yml,
# découpée par thème (phase 1 de la centralisation infra, cf. docs/infra_service.md).
# `docker compose up` depuis backend/ fonctionne comme avant ; les chemins relatifs
# de chaque fragment se résolvent depuis infra/compose/.
include:
  - infra/compose/base.yml        # réseau + volumes nommés
  - infra/compose/data.yml        # postgres, elasticsearch, redis, minio
  - infra/compose/services.yml    # les 7 API métier
  - infra/compose/workers.yml     # celery workers / beat / flower
  - infra/compose/edge.yml        # traefik + portail swagger
  - infra/compose/monitoring.yml  # prometheus, grafana, loki, tempo, exporters, filebeat
