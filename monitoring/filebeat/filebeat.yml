filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      # Décodage sous le namespace "app" (et non à la racine) : les logs
      # applicatifs (structlog) portent des clés `event`/`service` en chaîne qui
      # collisionnent avec les objets ECS réservés `event.*`/`service.*` →
      # rejet ES (document_parsing_exception). Sous `app.*`, plus de collision.
      - decode_json_fields:
          fields: ["message"]
          target: "app"
          overwrite_keys: true
          add_error_key: true

processors:
  - drop_fields:
      fields: ["agent", "ecs", "input", "log.offset"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "nutrilogs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.name: "nutrilogs"
setup.template.pattern: "nutrilogs-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

logging.level: warning
