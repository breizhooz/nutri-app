name: Nutri-App CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  # Contrôles statiques infra (phase 5) : le rendu compose passe et la chaîne
  # env_file couvre les champs requis des Settings pydantic (make check).
  infra-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Secrets factices
        # Les *.secrets.env sont gitignorés donc absents en CI. On les recrée
        # avec les clés requises listées dans les examples générés (lignes
        # non commentées) pour que env-check et le rendu compose passent.
        run: |
          for svc in user recipe menu crawler notification nutrition profile; do
            grep -E '^[A-Z_]+=' "infra/env/examples/${svc}.env.example" > "infra/env/secrets/${svc}.secrets.env"
          done
          touch infra/env/secrets/platform.secrets.env

      - name: make check (compose config + env-check)
        run: |
          pip install pyyaml
          make check

  analyze-user:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'service-user')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install & Test
        run: |
          cd service-user
          pip install ../shared/
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff bandit

      - name: Run linter user
        run: |
          cd service-user
          ruff check .

      - name: Check formatting user
        run: |
          cd service-user
          ruff format --check .
      
      - name: Security scan
        run: |
          cd service-user
          bandit -r . -f json -o bandit-report.json --exit-zero

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: service-user/bandit-report.json
      
      - name: SonarScan User
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: service-user
          args: 
            -Dsonar.organization=sonar-nutri-app
            -Dsonar.projectKey=nutri-app-service-user
            -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run test User
        run: |
          cd service-user  
          pytest --cov=app --cov-report=xml:coverage.xml --cov-fail-under=80 -m "not smoke"

    
  analyze-recipe:
