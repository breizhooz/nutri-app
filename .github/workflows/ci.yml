  smoke-tests:
      needs: [analyze-user, analyze-recipe, analyze-menu, analyze-crawler, analyze-notification, analyze-nutrition, analyze-profile]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5

        - name: Setup Python
          uses: actions/setup-python@v5
          with: { python-version: '3.12' }

        - name: Install smoke test dependencies
          run: pip install httpx pytest pyotp

        - name: Create .env file
          run: |
            echo "POSTGRES_USER_DB=${{ secrets.USER_DB_NAME }}" >> .env
            echo "POSTGRES_USER_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_USER_PASSWORD=${{ secrets.POSTGRES_USER_PASSWORD }}" >> .env

            echo "POSTGRES_RECIPE_DB=${{ secrets.RECIPE_DB_NAME }}" >> .env
            echo "POSTGRES_RECIPE_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_RECIPE_PASSWORD=${{ secrets.POSTGRES_RECIPE_PASSWORD }}" >> .env
            
            echo "POSTGRES_MENU_DB=${{ secrets.MENU_DB_NAME }}" >> .env
            echo "POSTGRES_MENU_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_MENU_PASSWORD=${{ secrets.POSTGRES_MENU_PASSWORD }}" >> .env

            echo "POSTGRES_CRAWLER_DB=${{ secrets.CRAWLER_DB_NAME }}" >> .env
            echo "POSTGRES_CRAWLER_USER=${{ secrets.POSTGRES_CRAWLER }}" >> .env
            echo "POSTGRES_CRAWLER_PASSWORD=${{ secrets.POSTGRES_MENU_CRAWLER }}" >> .env

            echo "POSTGRES_NUTRITION_DB=nutrition_db" >> .env
            echo "POSTGRES_NUTRITION_USER=nutrition_user" >> .env
            echo "POSTGRES_NUTRITION_PASSWORD=nutrition_pass_ci" >> .env

            echo "POSTGRES_NOTIFICATION_DB=notification_db" >> .env
            echo "POSTGRES_NOTIFICATION_USER=notification_user" >> .env
            echo "POSTGRES_NOTIFICATION_PASSWORD=notification_pass_ci" >> .env

            echo "POSTGRES_PROFILE_DB=profile_db" >> .env
            echo "POSTGRES_PROFILE_USER=profile_user" >> .env
            echo "POSTGRES_PROFILE_PASSWORD=profile_pass_ci" >> .env
            
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "ELASTICSEARCH_URL=http://elasticsearch:9200" >> .env
            echo "ELASTICSEARCH_INDEX_RECIPES=recipes" >> .env

            echo "MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}" >> .env
            echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}" >> .env
            echo "MINIO_ENDPOINT=minio:9000" >> .env
            echo "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> .env
            echo "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}" >> .env
            echo "MINIO_BUCKET_CRAWLER=crawler-media" >> .env
            echo "MINIO_SECURE=False" >> .env
            echo "SERVICE_RECIPE_URL=http://service-recipe:8000" >> .env
            echo "CELERY_BROKER_URL=redis://redis:6379/0" >> .env
            echo "CELERY_RESULT_BACKEND=redis://redis:6379/1" >> .env

            echo "POSTGRES_NOTIFICATION_DB=${{ secrets.NOTIFICATION_DB_NAME }}" >> .env
            echo "POSTGRES_NOTIFICATION_USER=${{ secrets.POSTGRES_NOTIFICATION }}" >> .env
            echo "POSTGRES_NOTIFICATION_PASSWORD=${{ secrets.POSTGRES_MENU_NOTIFICATION }}" >> .env
            
            echo "POSTGRES_NUTRITION_DB=${{ secrets.NUTRITION_DB_NAME }}" >> .env
            echo "POSTGRES_NUTRITION_USER=${{ secrets.POSTGRES_NUTRITION }}" >> .env
            echo "POSTGRES_NUTRITION_PASSWORD=${{ secrets.POSTGRES_MENU_NUTRITION }}" >> .env

            echo "POSTGRES_PROFILE_DB=${{ secrets.PROFILE_DB_NAME }}" >> .env
            echo "POSTGRES_PROFILE_USER=${{ secrets.POSTGRES_PROFILE }}" >> .env
            echo "POSTGRES_PROFILE_PASSWORD=${{ secrets.POSTGRES_MENU_PROFILE }}" >> .env

            echo "SERVICE_PROFILE_TOKEN=ci-inter-service-token" >> .env
            echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" >> .env
            echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> .env
            echo "VAPID_CLAIMS_EMAIL=ci@nutriplanner.app" >> .env

            echo "SERVICE_NOTIFICATION_URL=${{ secrets.SERVICE_NOTIFICATION_URL }}" >> .env
            echo "SERVICE_NOTIFICATION_TOKEN=${{ secrets.SERVICE_NOTIFICATION_TOKEN }}" >> .env

            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "FACEBOOK_CLIENT_ID=${{ secrets.FACEBOOK_CLIENT_ID }}" >> .env
            echo "FACEBOOK_CLIENT_SECRET=${{ secrets.FACEBOOK_CLIENT_SECRET }}" >> .env
            echo "OAUTH_REDIRECT_BASE_URL=${{ secrets.OAUTH_REDIRECT_BASE_URL }}" >> .env
            echo "MFA_TOTP_ENCRYPTION_KEY=${{ secrets.MFA_TOTP_ENCRYPTION_KEY }}" >> .env
            echo "NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}" >> .env
            echo "NOTIFICATION_SERVICE_TOKEN=${{ secrets.NOTIFICATION_SERVICE_TOKEN }}" >> .env

            

            # Env stratifiés (infra/env/) : la chaîne env_file de chaque service
            # référence secrets/<svc>.secrets.env, gitignorés donc absents en CI.
            # On y copie le superset .env (même approche que l'ancien conf/.env) ;
            # chargé en dernier, il garde la précédence sur services/<svc>.env.
            for svc in platform user recipe menu crawler notification nutrition profile; do
              cp .env "infra/env/secrets/${svc}.secrets.env"
            done

        - name: Verify env files
          run: |
            echo "=== Fichiers d'env en place ==="
            ls -la infra/env/secrets/
            wc -l .env

        - name: Spin up containers
          run: docker compose up -d || true 
        
        - name: Force check service-user logs
          run: |
            echo "Waiting 20s for service-user to fail..."
            sleep 20
            echo "=== Service User Logs ==="
            docker compose logs service-user --tail=300
            echo ""
            echo "=== Container inspect ==="
            docker inspect nutriplanner-service-user --format='{{.State.Health.Log}}'

        - name: Show container status immediately
          run: |
            echo "=== Container Status ==="
            docker compose ps
            echo ""
            echo "=== Service User Logs ==="
            docker compose logs service-user --tail=100
            echo ""
            echo "=== Service Recipe Logs ==="
            docker compose logs service-recipe --tail=100
            echo ""
            echo "=== Service Menu Logs ==="
            docker compose logs service-menu --tail=100
            echo ""
            echo "=== Service Crawler Logs ==="
            docker compose logs service-crawler --tail=100

        - name: Wait for services to be healthy
          run: |
            echo "Waiting for service-user on localhost:8001..."
            timeout 60 bash -c 'until curl -f http://localhost:8001/health 2>/dev/null; do sleep 2; done'
            echo "Waiting for service-recipe on localhost:8002..."
            timeout 60 bash -c 'until curl -f http://localhost:8002/health 2>/dev/null; do sleep 2; done'
            echo "Waiting for service-menu on localhost:8003..."
            timeout 120 bash -c 'until curl -f http://localhost:8003/health 2>/dev/null; do sleep 2; done'
            echo "Waiting for service-crawler on localhost:8004..."
            timeout 120 bash -c 'until curl -f http://localhost:8004/health 2>/dev/null; do sleep 2; done'
            echo "Waiting for service-nutrition on localhost:8005..."
            timeout 60 bash -c 'until curl -f http://localhost:8005/health 2>/dev/null; do sleep 2; done'
            echo "Waiting for service-notification on localhost:8006..."
            timeout 60 bash -c 'until curl -f http://localhost:8006/health 2>/dev/null; do sleep 2; done'
            echo "Waiting for service-profile on localhost:8007..."
            timeout 60 bash -c 'until curl -f http://localhost:8007/health 2>/dev/null; do sleep 2; done'
            echo "All services ready!"

        - name: Run Smoke Tests — service-user
          run: pytest service-user/tests/smoke_test.py --noconftest -m smoke -v

        - name: Run Smoke Tests — service-recipe
          run: pytest service-recipe/tests/smoke_test.py --noconftest -m smoke -v

        - name: Run Smoke Tests — service-menu
          run: pytest service-menu/tests/smoke_test.py --noconftest -m smoke -v

        - name: Run Smoke Tests — service-crawler
          run: pytest service-crawler/tests/smoke_test.py --noconftest -m smoke -v

        - name: Run Smoke Tests — service-nutrition
          run: pytest service-nutrition/tests/smoke_test.py --noconftest -m smoke -v

        - name: Run Smoke Tests — service-notification
          run: pytest service-notification/tests/smoke_test.py --noconftest -m smoke -v

        - name: Run Smoke Tests — service-profile
          run: pytest service-profile/tests/smoke_test.py --noconftest -m smoke -v

        - name: Debug - Show service logs on failure
          if: failure()
          run: |
            echo "=== Service User Logs ==="
            docker compose logs service-user
            echo ""
            echo "=== Service Recipe Logs ==="
            docker compose logs service-recipe
            echo ""
            echo "=== Service Menu Logs ==="
            docker compose logs service-menu
            echo ""
            echo "=== Service crawler Logs ==="
            docker compose logs service-crawler
            echo "=== Service notification Logs ==="
            docker compose logs service-notification
            echo "=== Service nutrition Logs ==="
            docker compose logs service-nutrition
            echo "=== Service profile Logs ==="
            docker compose logs service-profile